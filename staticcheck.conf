# .golangci.yml is the source of truth for this repository's lint policy; CI
# runs golangci-lint, which drives staticcheck from the settings there. This
# file exists only so that running `staticcheck ./...` directly agrees with it,
# rather than burying a contributor in findings CI does not report.
#
# ST1005 (error strings lower-case and unpunctuated) is off because most of
# this engine's error strings are not Go errors in that sense: they are the
# message member of a GraphQL error, read by API clients, and every reference
# implementation writes them as sentences. The reasoning lives in .golangci.yml.
checks = ["all", "-ST1005"]
