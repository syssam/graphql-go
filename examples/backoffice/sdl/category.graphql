# Hand-written beside velox's output, which has no single-row query and no
# delete. Named after the entity, so both land in the category group.
extend type Query {
  "The Category with this id, or null if there is none."
  category(id: ID!): Category
}

extend type Mutation {
  "Deletes the Category and returns its id. Refused while other rows refer to it."
  deleteCategory(id: ID!): ID!
}
