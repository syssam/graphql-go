# Hand-written beside velox's output, which has no single-row query and no
# delete. Named after the entity, so both land in the stock group.
extend type Query {
  "The Stock with this id, or null if there is none."
  stock(id: ID!): Stock
}

extend type Mutation {
  "Deletes the Stock and returns its id. Refused while other rows refer to it."
  deleteStock(id: ID!): ID!
}
