# Hand-written beside velox's output, which has no single-row query and no
# delete. Named after the entity, so both land in the customer group.
extend type Query {
  "The Customer with this id, or null if there is none."
  customer(id: ID!): Customer
}

extend type Mutation {
  "Deletes the Customer and returns its id. Refused while other rows refer to it."
  deleteCustomer(id: ID!): ID!
}
