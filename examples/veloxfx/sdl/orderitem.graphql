# Hand-written beside velox's output, which has no single-row query and no
# delete. Named after the entity, so both land in the orderitem group.
extend type Query {
  "The OrderItem with this id, or null if there is none."
  orderItem(id: ID!): OrderItem
}

extend type Mutation {
  "Deletes the OrderItem and returns its id. Refused while other rows refer to it."
  deleteOrderItem(id: ID!): ID!
}
