name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly on an unchanged tree: govulncheck's database and the dependencies'
  # own releases move without a push here, and the fuzz job runs a longer
  # campaign than a push can afford.
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  # The event is in the key so that a push to main does not cancel the
  # weekly run's fuzz campaign.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  # Generation and compile benchmarks shell out to go; keep the toolchain from
  # silently fetching a different one mid-run.
  GOTOOLCHAIN: local

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Slowest leg measured: Windows, about 7 minutes.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Windows is where this is developed and Linux is where it will run, so
        # both gate. macOS catches the arm64 differences neither would.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        shell: bash
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      # compare/ is generated, not committed, and the gate skips a module whose
      # fixtures are missing. Without this step the gate printed "compare
      # skipped" and exited 0, so TestEnginesAgree -- the correctness
      # cross-check against gqlgen -- never ran in CI at all. 25 entities is
      # the generator's default and enough to compare behaviour; the 200 the
      # published numbers use is a benchmarking size, not a correctness one.
      - name: Generate compare fixtures
        shell: bash
        run: cd compare && go run gen.go -n 25

      # scripts/gate.sh walks every go.mod. go vet and go test reach only the
      # module they run in, and this repository has five; a root-only run
      # reports success while testing none of benchmarks, compare or lint.
      # GATE_REQUIRE_ALL turns the skip above into a failure, so dropping the
      # generate step cannot quietly take compare out of the gate again.
      - name: Gate every module
        shell: bash
        run: GATE_REQUIRE_ALL=1 sh scripts/gate.sh

      - name: Generated code is current
        shell: bash
        run: |
          (cd examples/blog && go generate ./...)
          (cd examples/backoffice && go generate .)
          # git status, not git diff: a file the generator writes that was
          # never committed is untracked, and git diff does not look at those.
          changed=$(git status --porcelain -- .)
          if [ -n "$changed" ]; then
            echo "generated code is stale or not committed; run go generate in examples/blog or examples/backoffice"
            echo "$changed"; git diff --stat; exit 1
          fi

  postgres:
    # The velox example on a real server: projection, per-parent limits
    # (ROW_NUMBER), the ownership filter and error classification all meet a
    # planner that is not SQLite's. The first run here found a foreign-key
    # violation reported as a duplicate.
    name: backoffice on PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pass
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      # With the URL unset or its name misspelled the same suite passes on
      # SQLite. BACKOFFICE_REQUIRE_POSTGRES makes that a failure, so this job
      # cannot be green without having reached the server.
      - name: Test examples/backoffice on PostgreSQL
        env:
          BACKOFFICE_POSTGRES: postgres://postgres:pass@localhost:5432/postgres?sslmode=disable
          BACKOFFICE_REQUIRE_POSTGRES: "1"
        run: go -C examples/backoffice test -race -count=1 ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      # golangci-lint must be built with a Go at least as new as go.mod's
      # version, or it refuses to load the config with "the Go language
      # version (goX) used to build golangci-lint is lower than the targeted
      # Go version". If this job is the only red one and that is the message,
      # pin a version built with the current toolchain rather than debugging
      # the config.
      #
      # golangci-lint-action@v6 installs only v1 releases (v1.64.8, built with
      # go1.24), which refuse this module and the v2 config outright. Built
      # from source here, it is always compiled by the toolchain go.mod names.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
      - name: Lint the root module
        run: golangci-lint run ./...
      # compare/ imports its generated engines, which are gitignored; without
      # them the typecheck fails before any linter runs.
      - name: Generate compare fixtures
        run: cd compare && go run gen.go -n 25
      # A go.mod or go.sum that `go mod tidy` would change is a dependency
      # edit nobody committed, and the next person to run tidy gets it in an
      # unrelated diff. After the fixtures, since compare/ imports them. Found
      # like the modules above, and `-diff` exits non-zero without writing.
      - name: go.mod is tidy in every module
        shell: bash
        run: |
          mods=$(find . -name go.mod -not -path "./ref/*" | sed "s|/go.mod$||")
          [ -n "$mods" ]
          for mod in $mods; do
            echo "== $mod"
            (cd "$mod" && go mod tidy -diff)
          done
      # The action lints the directory it runs in, and this repository has five
      # modules. Without this it linted the root and reported success, the same
      # shape as `go test ./...` reaching one module of five: benchmarks/ was
      # carrying 18 findings under this very config and compare/ 4, neither ever
      # asked. The root .golangci.yml is found by searching upward, so the
      # policy is the same in each.
      - name: Lint every other module
        shell: bash
        run: |
          # Found, not listed: a list is how examples/backoffice, the fifth module,
          # would have gone unlinted.
          for mod in $(find . -name go.mod -not -path "./ref/*" -not -path "./go.mod" | sed "s|/go.mod$||"); do
            echo "== $mod"
            (cd "$mod" && golangci-lint run ./...)
          done

      # The repository ships its own analyzer for a bug class -race cannot
      # find: a check-then-act pair on OperationContext that silently degrades
      # DataLoader batching to N+1.
      - name: Build gqlvet
        run: cd lint && go build -o "$RUNNER_TEMP/gqlvet" ./cmd/gqlvet
      # The analyzer's usual answer is silence, and so is the answer of one
      # that no longer matches the context type. It has to report the code
      # written to be reported before its silence elsewhere means anything.
      # 3 is the exit status for findings; 1 is a package that did not load.
      - name: gqlvet reports its control
        shell: bash
        run: |
          status=0
          "$RUNNER_TEMP/gqlvet" ./scripts/testdata/gqlvet || status=$?
          if [ "$status" != 3 ]; then
            echo "gqlvet exited $status on scripts/testdata/gqlvet, which it must report (exit 3)"
            exit 1
          fi
      # Every module, found the way the lint step above finds them. Run from
      # the root it reached one of five, the same shape as the lint job once
      # had.
      - name: Run gqlvet on every module
        shell: bash
        run: |
          mods=$(find . -name go.mod -not -path "./ref/*" | sed "s|/go.mod$||")
          [ -n "$mods" ]
          for mod in $mods; do
            echo "== $mod"
            (cd "$mod" && "$RUNNER_TEMP/gqlvet" ./...)
          done

  bench:
    name: allocations (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      # Without -race, deliberately: the detector changes allocation counts,
      # and the test skips itself under it. The gate job runs everything else
      # with -race, so this is the one place these benchmarks execute.
      #
      # Allocations are the only figure worth asserting on a shared runner.
      # Timings there are noise -- this repository has read a single sample
      # wrong by 20-77% on its own warm machine -- so they are published as an
      # artifact to look at, never failed on.
      #
      # -count=1 because the build cache is restored between runs and Go's
      # cache of test results is in it: an unchanged package answers "ok
      # (cached)" without running. And the PASS line is required, because
      # -run matching nothing is "no tests to run" and exit 0 -- a rename
      # would leave this job green with nothing in it.
      - name: Allocation baseline
        shell: bash
        run: |
          go test -count=1 -run '^TestAllocationBaseline$' -v . | tee "$RUNNER_TEMP/alloc.txt"
          if ! grep -q '^--- PASS: TestAllocationBaseline ' "$RUNNER_TEMP/alloc.txt"; then
            echo "TestAllocationBaseline did not run and pass"
            exit 1
          fi

      - name: Benchmark timings, for the record only
        run: |
          go test -run "^$" -bench . -benchmem -count=6 . | tee bench-linux.txt
        continue-on-error: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bench-linux
          path: bench-linux.txt
        if: always()

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      # Built from source with the toolchain go.mod names, not installed from
      # a release: a govulncheck older than that Go cannot load the packages
      # and reports nothing useful, the same failure staticcheck has here.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      # compare/ imports its generated engines, which are gitignored; without
      # them govulncheck cannot load the module and fails before scanning.
      - name: Generate compare fixtures
        run: cd compare && go run gen.go -n 25
      # Every module, for the same reason scripts/gate.sh walks every module.
      - name: Scan
        run: |
          for mod in $(find . -name go.mod -not -path "./ref/*" | sed "s|/go.mod$||"); do
            echo "== $mod"
            (cd "$mod" && govulncheck ./...)
          done

  fuzz:
    name: fuzz (smoke)
    runs-on: ubuntu-latest
    # The weekly campaign is eight targets at ten minutes each; a push is six
    # minutes in all.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      # Short by design. This is a smoke test that the fuzz targets still build
      # and that the seed corpus passes, not a fuzzing campaign.
      #
      # Discovery is go test -list over every package. Grepping the root
      # package's *_test.go, which this replaced, silently left internal/jsonw
      # out: its FuzzString and FuzzKey guard the JSON string escaping, where
      # a bug is a corrupted response, and neither had ever been fuzzed here.
      #
      # The grep is back as a cross-check and no more: a package whose test
      # files declare a fuzz target must list one. A loop over the output of a
      # command that failed runs no times and exits 0, so each listing is an
      # assignment, which stops the script when the command fails.
      - name: Fuzz targets
        shell: bash
        env:
          # 30s per target on a push is a smoke test; the weekly run is the
          # campaign, long enough to get past the seed corpus's neighbourhood.
          FUZZTIME: ${{ github.event_name == 'schedule' && '10m' || '30s' }}
        run: |
          pkgs=$(go list -f '{{.ImportPath}} {{.Dir}}' ./...)
          ran=0
          # On a descriptor of its own: a test binary that reads standard
          # input would otherwise eat the rest of the list and end the loop.
          while read -r pkg dir <&3; do
            listed=$(go test -list 'Fuzz.*' "$pkg")
            targets=$(printf '%s\n' "$listed" | grep '^Fuzz' || true)
            if [ -z "$targets" ] && grep -qs '^func Fuzz' "$dir"/*_test.go; then
              echo "$pkg declares a fuzz target and go test -list found none"
              exit 1
            fi
            for target in $targets; do
              echo "== $pkg $target"
              go test -run '^$' -fuzz "^${target}$" -fuzztime "$FUZZTIME" "$pkg"
              ran=$((ran + 1))
            done
          done 3<<<"$pkgs"
          if [ "$ran" = 0 ]; then
            echo "no fuzz target was found in any package"
            exit 1
          fi

  # One check to require in branch protection. The matrix names (test (windows-
  # latest) and so on) change when an OS is added, and a required check that no
  # longer exists blocks every merge; this one is named here and stays. Always
  # run, because a job that failed skips its dependants, and a skipped required
  # check reads as passing.
  ci-ok:
    name: CI passed
    if: ${{ always() }}
    needs: [test, postgres, lint, bench, vuln, fuzz]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job succeeded
        shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          # Empty would pass the loop below having checked nothing.
          [ -n "$RESULTS" ]
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "a job finished $result: $RESULTS"; exit 1
            fi
          done
